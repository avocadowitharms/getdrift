<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Open Drift Blog Preview</title>
    <meta http-equiv="refresh" content="0; url=blog/index.html" />
    <link rel="canonical" href="blog/index.html" />
    <style>
      :root {
        font-family:
          "JetBrains Mono", "Cascadia Mono", "SFMono-Regular", Consolas,
          monospace;
      }

      body {
        display: grid;
        min-height: 100vh;
        place-items: center;
        margin: 0;
        background: #f8f8f7;
        color: #111;
      }

      main {
        width: min(520px, calc(100% - 32px));
        padding: 32px;
        border: 1px solid #d7d7d7;
        border-radius: 8px;
        background: #fff;
      }

      a {
        color: inherit;
        font-weight: 800;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Opening Drift Blog</h1>
      <p>
        If the preview does not redirect automatically, open
        <a href="blog/index.html">blog/index.html</a>.
      </p>
    </main>
  </body>
</html>
